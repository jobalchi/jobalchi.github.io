<div class="col mt-4 timeline-section-{{ include.variant }}">
  <h2 class="mb-3">{{ include.title }}</h2>

  <div class="timeline-body bg-themed">
    {% for item in include.source %}
      <div class="timeline-item">
        <div class="content">
          <h2>{{ item.title }}</h2>
          <h6 class="date">
            {{ item.from }}{% if item.to %} — {{ item.to }}{% endif %}
          </h6>
          <p>{{ item.description }}</p>
        </div>
      </div>
    {% endfor %}
  </div>
</div>
